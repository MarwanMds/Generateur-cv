<div class="field-styler-popover" id="styler-{{ field_key }}" data-field="{{ field_key }}">
  <div class="styler-header">
    <span>Style: <span class="field-label-name">{{ label }}</span></span>
    <button type="button" class="styler-close" data-close="{{ field_key }}" title="Close">×</button>
  </div>

  <div class="styler-row">
    <div class="styler-label">Font Family</div>
    <select class="form-select form-select-sm styler-control" data-field="{{ field_key }}" data-prop="font_family">
      <option value="">— inherit global —</option>
      <option value="DM Sans">DM Sans</option>
      <option value="Roboto">Roboto</option>
      <option value="Open Sans">Open Sans</option>
      <option value="Lato">Lato</option>
      <option value="Montserrat">Montserrat</option>
      <option value="Playfair Display">Playfair Display</option>
      <option value="Raleway">Raleway</option>
      <option value="Merriweather">Merriweather</option>
      <option value="Nunito">Nunito</option>
      <option value="Poppins">Poppins</option>
      <option value="Ubuntu">Ubuntu</option>
      <option value="Georgia">Georgia (serif)</option>
      <option value="Courier New">Courier New (mono)</option>
    </select>
  </div>

  <div class="styler-row">
    <div class="styler-label">Font Size</div>
    <select class="form-select form-select-sm styler-control" data-field="{{ field_key }}" data-prop="font_size">
      <option value="">— inherit —</option>
      <option value="10px">10px — Tiny</option>
      <option value="11px">11px — XSmall</option>
      <option value="12px">12px — Small</option>
      <option value="13px">13px</option>
      <option value="14px">14px — Normal</option>
      <option value="15px">15px</option>
      <option value="16px">16px — Medium</option>
      <option value="18px">18px — Large</option>
      <option value="20px">20px — XLarge</option>
      <option value="24px">24px — 2XL</option>
      <option value="28px">28px — 3XL</option>
      <option value="32px">32px — Heading</option>
    </select>
  </div>

  <div class="styler-row">
    <div class="styler-label">Font Weight</div>
    <select class="form-select form-select-sm styler-control" data-field="{{ field_key }}" data-prop="font_weight">
      <option value="">— inherit —</option>
      <option value="300">300 – Light</option>
      <option value="400">400 – Regular</option>
      <option value="500">500 – Medium</option>
      <option value="600">600 – Semi-Bold</option>
      <option value="700">700 – Bold</option>
      <option value="800">800 – Extra-Bold</option>
      <option value="900">900 – Black</option>
    </select>
  </div>

  <div class="styler-row">
    <div class="styler-label">Style</div>
    <select class="form-select form-select-sm styler-control" data-field="{{ field_key }}" data-prop="font_style">
      <option value="">— normal —</option>
      <option value="italic">Italic</option>
      <option value="oblique">Oblique</option>
    </select>
  </div>

  <div class="styler-row">
    <div class="styler-label">Text Color</div>
    <div class="d-flex align-items-center gap-2">
      <input type="color"
             class="form-control form-control-color form-control-sm styler-control"
             style="width:44px;height:32px;padding:2px;"
             data-field="{{ field_key }}" data-prop="color" value="#000000">
      <input type="text"
             class="form-control form-control-sm styler-color-hex"
             data-field="{{ field_key }}"
             placeholder="#000000" maxlength="9"
             style="width:90px;font-family:monospace;font-size:.78rem;">
      <button type="button"
              class="btn btn-sm btn-outline-secondary styler-clear-color"
              data-field="{{ field_key }}" title="Remove color override"
              style="font-size:.72rem;padding:2px 6px;">✕</button>
    </div>
  </div>

  <div class="styler-label" style="margin-top:.6rem;">Preview</div>
  <div class="styler-preview-text" id="styler-preview-{{ field_key }}">
    Sample Text — {{ label }}
  </div>

  <button type="button" class="styler-reset-btn" data-field="{{ field_key }}">
    ↩ Reset to default
  </button>
</div>
