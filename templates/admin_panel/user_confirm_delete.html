{% extends 'base.html' %}
{% block title %}Delete User — Admin Panel{% endblock %}
{% block content %}
<div style="min-height:calc(100vh - 140px);display:flex;align-items:center;justify-content:center;padding:3rem 1rem;">
  <div class="card" style="max-width:460px;width:100%;">
    <div class="card-body p-4 text-center">
      <div style="width:64px;height:64px;border-radius:50%;background:#fee2e2;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:1.8rem;color:#dc2626;">
        <i class="bi bi-exclamation-triangle-fill"></i>
      </div>
      <h5 style="font-family:var(--font-display);font-weight:700;">Delete User</h5>
      <p style="color:var(--text-muted);font-size:.9rem;">
        Are you sure you want to delete <strong>{{ target_user.username }}</strong>?<br>
        This will permanently delete the user and <strong>all their CVs</strong>.
      </p>
      <div class="d-flex gap-2 justify-content-center mt-3">
        <a href="{% url 'admin_panel:users_list' %}" class="btn btn-outline-secondary">Cancel</a>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">
            <i class="bi bi-trash me-1"></i>Yes, Delete
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
